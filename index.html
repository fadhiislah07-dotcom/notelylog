<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>notelylog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Google Sign-In / cloud sync: fill in firebase-config.js with your own Firebase project to enable -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<a href="#view" class="visually-hidden-focusable" style="position:absolute; left:-9999px; top:0; background:var(--bg-elevated); color:var(--text); padding:10px 16px; border-radius:8px; z-index:999;" onfocus="this.style.left='16px'; this.style.top='16px';" onblur="this.style.left='-9999px';">Skip to content</a>
<div id="shell">
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">notelylog<span class="dot">.</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div id="sidebar-foot"></div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button class="search-btn" id="open-search" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Search subjects, notes, PDFs…</span>
      </button>
      <div class="grow" style="flex:1"></div>
      <span id="save-indicator" aria-live="polite"><span class="dot"></span>Saved</span>
      <div id="account-widget"></div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>
</div>

<nav id="bottom-nav" aria-label="Mobile navigation"></nav>

<div id="reader-root"></div>

<div id="modal-backdrop" role="dialog" aria-modal="true"><div id="modal-inner"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
